name: 💡 Feature Request
description: Suggest a capability or improvement for the Bytos VS Code extension
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the problem first, then the
        change you would like. Do not include secrets or private code.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow or limitation, not only the proposed UI.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Bytos do differently?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or designs you have tried.
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Area
      options:
        - Agent / chat
        - Auto Phase Plan
        - Voice / microphone
        - Provider or model
        - MCP / tools
        - Documentation
        - Other
      default: 0
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this request.
          required: true
