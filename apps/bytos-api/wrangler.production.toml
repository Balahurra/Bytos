name = "bytos-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
workers_dev = true

[vars]
SUPABASE_URL = "https://qetnpmgyseccwbpsjxcl.supabase.co"
APP_BASE_URL = "https://bytos.dev"
