name: 🐛 Bug Report
description: Report a reproducible bug in the Bytos VS Code extension
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Before opening this issue, please search existing issues and check the
        troubleshooting docs. **Do not report security vulnerabilities here**;
        use the private advisory link in `SECURITY.md`.

        Include enough detail for someone else to reproduce the problem. Remove
        API keys, tokens, and private code from logs before pasting them.
  - type: dropdown
    id: component
    attributes:
      label: Area
      description: Which part of the VS Code extension is affected?
      options:
        - Agent / chat
        - Auto Phase Plan
        - Voice / microphone
        - Provider or model
        - MCP / tools
        - Installation or update
        - Other
      default: 0
    validations:
      required: true
  - type: input
    id: bytos-version
    attributes:
      label: Bytos version
      description: Find this at the bottom of the Bytos Settings view.
      placeholder: 'e.g., 1.0.2'
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      description: Open Help → About (or Code → About on macOS) and copy the version.
      placeholder: 'e.g., 1.101.0'
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - Other
      default: 0
    validations:
      required: true
  - type: input
    id: provider-model
    attributes:
      label: Provider and model
      description: Which provider and model were selected when the issue occurred?
      placeholder: 'e.g., OpenRouter / anthropic/claude-sonnet; Ollama / qwen2.5-coder'
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
      placeholder: Tell us what you saw.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal, ordered reproduction is the most useful part of a bug report.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Logs and diagnostics
      description: Paste relevant output or screenshots. Redact API keys, tokens, and private code.
      placeholder: VS Code Output panel, terminal output, or a screenshot description.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed API keys, tokens, and private code from the report.
          required: true
        - label: This is not a security vulnerability (those go through the private advisory link).
          required: true
