name = "bytos-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"
workers_dev = true

[vars]
SUPABASE_URL = "https://qetnpmgyseccwbpsjxcl.supabase.co"
APP_BASE_URL = "https://bytos.dev"
# SUPABASE_ANON_KEY is supplied via .dev.vars / `wrangler secret put`.
# HANDOFF_ENCRYPTION_KEY is supplied via .dev.vars / `wrangler secret put`.

[[d1_databases]]
binding = "DB"
database_name = "bytos-api-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Local scheduled cleanup can be exercised with:
#   wrangler dev --test-scheduled
#   curl "http://127.0.0.1:8787/__scheduled?cron=*/15+*+*+*+*"
[triggers]
crons = ["*/15 * * * *"]
